name: Synthetic healthcare strategy checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m src.generate_data
      - run: python -m src.analyze
      - run: python -m src.build_sqlite
      - run: python -m src.run_sql_queries
      - run: python -m src.weight_sensitivity
      - run: python -m unittest discover -s tests -v

      - uses: actions/upload-artifact@v7
        with:
          name: generated-healthcare-datasets-and-reports
          path: |
            data/
            outputs/
